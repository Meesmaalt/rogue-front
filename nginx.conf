server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json model/gltf-binary;
  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
  location /api/ { proxy_pass http://multiplayer:8787; proxy_set_header Host $host; }
  location /ws {
    proxy_pass http://multiplayer:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri /index.html; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
