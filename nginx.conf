server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json model/gltf-binary;
  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
  location /api/ { proxy_pass http://multiplayer:8787; proxy_set_header Host $host; }
  location /ws {
    proxy_pass http://multiplayer:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri /index.html; }
  # GLB is not included in every nginx mime.types; give it the compressible type explicitly.
  location ~ \.glb$ {
    types { model/gltf-binary glb; }
    try_files $uri =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
