services:
  dev:
    build: { context: ., target: dev }
    ports: ["5173:5173"]
    depends_on:
      multiplayer: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    environment:
      - CHOKIDAR_USEPOLLING=true
      - ROGUE_FRONT_API_TARGET=http://multiplayer:8787

  prod:
    profiles: ["prod"]
    build: { context: ., target: prod }
    ports: ["8080:80"]
    depends_on:
      multiplayer: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  multiplayer:
    build: ./server
    volumes: ["accounts:/app/data"]
    ports: ["8787:8787"]
    environment:
      - PORT=8787
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  accounts:
